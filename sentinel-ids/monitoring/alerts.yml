groups:
- name: ids
  rules:
  - alert: ThreatSpike
    expr: sum(rate(threats_total[1m])) > 3 * sum(rate(threats_total[30m] offset 5m)) and sum(rate(threats_total[1m])) > 5
    for: 1m
    labels: {severity: critical}
  - alert: InferenceSlow
    expr: histogram_quantile(0.95, sum by (le)(rate(ml_inference_seconds_bucket[2m]))) > 0.25
    for: 2m
  - alert: PredictionErrors
    expr: rate(prediction_errors_total[5m]) > 0
    for: 2m
